name: check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: PHP runtime for module tests
        run: php --version || { sudo apt-get update && sudo apt-get install -y php-cli; }
      - name: make check
        env:
          KOMBINAT_REQUIRE_RUNTIMES: "1"
        run: make check
